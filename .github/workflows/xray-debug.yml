name: Xray Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Accept Android SDK licenses and install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;30.0.14904198"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUiOvpn2Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show root cause
        if: failure()
        run: grep -n "Caused by" build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: XrayOvpn-debug-apk
          path: main/build/outputs/apk/**/*.apk
          if-no-files-found: error
